name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-msvc:
    runs-on: windows-2022
    env:
      VCPKG_ROOT: ${{ github.workspace }}\.vcpkg
    steps:
      - uses: actions/checkout@v7
      - name: Check out pinned vcpkg baseline
        uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          ref: 45f9f39362a4c52e2b1fbe57b7e649db7f3d96d4
          path: .vcpkg
      - name: Bootstrap vcpkg
        shell: pwsh
        run: ./.vcpkg/bootstrap-vcpkg.bat -disableMetrics
      - name: Configure, build, and test
        shell: pwsh
        run: ./scripts/build.ps1 -Preset windows-msvc-release -VerifyInstall
      - name: Generated ground-truth acceptance
        run: python scripts/validate-generated.py --output out/validation/ci-windows --pcad out/build/windows-msvc-release/bin/pcad.exe

  linux-gcc:
    runs-on: ubuntu-24.04
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
    steps:
      - uses: actions/checkout@v7
      - name: Check out pinned vcpkg baseline
        uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          ref: 45f9f39362a4c52e2b1fbe57b7e649db7f3d96d4
          path: .vcpkg
      - name: Bootstrap vcpkg
        run: ./.vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Configure, build, and test
        run: cmake --workflow --preset linux-gcc-release
      - name: Generated ground-truth acceptance
        run: python3 scripts/validate-generated.py --output out/validation/ci-linux --pcad out/build/linux-gcc-release/bin/pcad
      - name: Verify formatting
        run: cmake --build --preset linux-gcc-release --target format-check
      - name: Install package
        run: cmake --install out/build/linux-gcc-release --prefix out/install/linux-gcc-release
      - name: Verify installed CLI runtime
        run: env -u LD_LIBRARY_PATH ./out/install/linux-gcc-release/bin/pcad --version
      - name: Verify installed consumer
        run: |
          cmake -S tests/consumer -B out/consumer/linux-gcc-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/out/install/linux-gcc-release"
          cmake --build out/consumer/linux-gcc-release
          ./out/consumer/linux-gcc-release/pointcloud_ad_consumer

  linux-clang-sanitizers:
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
    steps:
      - uses: actions/checkout@v7
      - name: Check out pinned vcpkg baseline
        uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          ref: 45f9f39362a4c52e2b1fbe57b7e649db7f3d96d4
          path: .vcpkg
      - name: Bootstrap vcpkg
        run: ./.vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Install Clang OpenMP runtime
        run: sudo apt-get update && sudo apt-get install -y libomp-dev
      - name: Configure, build, and test with sanitizers
        run: cmake --workflow --preset linux-clang-asan
